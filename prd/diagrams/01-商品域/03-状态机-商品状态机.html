<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-accent:#eb6c36;--font-sans:'Geist','Noto Sans SC',system-ui,sans-serif;--font-serif:'Instrument Serif','Noto Serif SC',serif;--font-mono:'Geist Mono',ui-monospace,monospace}body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem}.frame{max-width:1260px;width:100%}.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}.note{font-size:.78rem;color:#7a8399;margin:-0.8rem 0 1.2rem;line-height:1.6}svg{width:100%;min-width:860px;display:block}@media(max-width:860px){svg{min-width:640px}}</style></head><body><div class="frame"><p class="eyebrow">State Machine · 商品域 PRD V7.0.0 · 图 12-3</p><h1>商品状态机</h1><p class="note">状态机：新建后进入审核中，审核通过在售、不通过修改重提；在售可下架再上架，删除为终态。</p><svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="g01c-t g01c-d"><title id="g01c-t">商品域·状态机</title><desc id="g01c-d">商品状态机：审核中、在售中、审核不通过、已下架与删除终态</desc><defs><marker id="g01c-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="g01c-arrow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="g01c-arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="g01c-arrow-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-wi hor="middle">含不通过理由</text><rect x="400" y="420" width="150" height="52" rx="8" fill="#f5f5f5"/><rect x="400" y="420" width="150" height="52" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="475.0" y="442" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">已下架</text><text x="475.0" y="460" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">不可见不可下单</text><path d="M 300,284 H 636" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#g01c-arrow)"/><rect x="439" y="285" width="58" height="14" rx="2" fill="#f5f5f5"/><text x="468" y="296" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">审核通过</text><path d="M 225,270 V 180 H 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#g01c-arrow)"/><rect x="276" y="181" width="69" height="14" rx="2" fill="#f5f5f5"/><text x="310" y="192" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">审核不通过</text><path d="M 430,172 V 240 H 232 Q 224,240 224,248 V 264" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#g01c-arrow)"/><rect x="284" y="217" width="91" height="14" rx="2" fill="#f5f5f5"/><text x="330" y="228" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">编辑后重新提交</text><path d="M 688,322 V 380 H 483 Q 475,380 475,388 V 414" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#g01c-arrow)"/><rect x="562" y="357" width="36" height="14" rx="2" fill="#f5f5f5"/><text x="580" y="368" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">下架</text><path d="M 550,446 H 706 Q 714,446 714,438 V 330" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#g01c-arrow)"/><rect x="607" y="423" width="58" height="14" rx="2" fill="#f5f5f5"/><t
