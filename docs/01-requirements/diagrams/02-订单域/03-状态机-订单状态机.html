ill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">终态</text><circle cx="666" cy="66" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="666" cy="66" r="5" fill="#2d3142"/><text x="24" y="496" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">注：待发货/已发货期间可发起售后，订单进入「售后中」挂起，全部售后完成后恢复原状态；部分发货/部分提货不改变主状态，累计至全部后流转。</text></svg></div></body></html>
