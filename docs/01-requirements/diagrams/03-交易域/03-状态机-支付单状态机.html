e="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">退款完成·终态</text><circle cx="770" cy="436" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="770" cy="436" r="5" fill="#2d3142"/><path d="M 150,436 H 118" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#g03c-arrow)"/><rect x="100" y="413" width="69" height="14" rx="2" fill="#f5f5f5"/><text x="134" y="424" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">超时·终态</text><circle cx="110" cy="436" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="110" cy="436" r="5" fill="#2d3142"/><text x="24" y="516" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">注：担保模式资金先锁定后解冻；非担保模式支付成功直接分账；已分账后发生售后按已退款处理并回滚佣金。</text></svg></div></body></html>
