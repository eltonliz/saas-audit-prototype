<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容审查域 · 接口时序图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · 内容审查域 PRD v2.0.0 · 图 9-6</p>
    <h1>外部接口时序：腾讯云回调与擦音对接</h1>

    <svg viewBox="0 0 1100 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-api-title audit-api-desc">
      <title id="audit-api-title">外部接口时序：腾讯云回调与擦音对接</title>
      <desc id="audit-api-desc">接口时序图：腾讯云审核回调经网关验签与去重后分发至审查服务，审查服务执行级别判定与断流指令，并向 AMS 发起回放擦音任务，最终向回放页同步拼接与发布状态。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 生命线 ===== -->
      <line x1="130" y1="112" x2="130" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="350" y1="112" x2="350" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="570" y1="112" x2="570" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="790" y1="112" x2="790" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1010" y1="112" x2="1010" y2="580" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== 激活条 ===== -->
      <rect x="346" y="150" width="8" height="100" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="126" y="150" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="566" y="244" width="8" height="264" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="126" y="312" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="786" y="376" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1006" y="472" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ===== 消息 ===== -->

      <!-- 1 审核 → 网关：POST /audit/callback -->
      <path d="M 138,150 H 342" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="160" y="128" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="230" y="139" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">① POST /audit/callback</text>

      <!-- 2 网关 self：验签 + 幂等去重 -->
      <path d="M 354,182 H 398 V 198 H 358" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="404" y="178" width="100" height="14" rx="2" fill="#f5f5f5"/>
      <text x="454" y="189" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">② 验签 + 幂等去重</text>

      <!-- 3 网关 → 审核：200 ACK（返回） -->
      <path d="M 346,210 H 138" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="208" y="188" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="240" y="199" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">③ 200 ACK</text>

      <!-- 4 网关 → 审查服务：分发违规事件（异步） -->
      <path d="M 354,244 H 562" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="384" y="222" width="128" height="14" rx="2" fill="#f5f5f5"/>
      <text x="448" y="233" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">④ 分发违规事件 · MQ</text>

      <!-- 5 审查服务 self：级别判定 -->
      <path d="M 574,276 H 618 V 292 H 578" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="624" y="272" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="680" y="283" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">⑤ 级别判定 L1/L2/L3</text>

      <!-- 6 审查服务 → 审核：断流指令 -->
      <path d="M 566,312 H 138" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="200" y="290" width="160" height="14" rx="2" fill="#f5f5f5"/>
      <text x="280" y="301" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑥ 断流指令 DropLiveStream</text>

      <!-- 7 审核 → 审查服务：断流执行结果（返回） -->
      <path d="M 138,340 H 562" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="260" y="318" width="80" height="14" rx="2" fill="#f5f5f5"/>
      <text x="300" y="329" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑦ 断流执行结果</text>

      <!-- 8 审查服务 → AMS：创建回放擦音任务 -->
      <path d="M 574,376 H 782" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="600" y="354" width="128" height="14" rx="2" fill="#f5f5f5"/>
      <text x="664" y="365" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑧ 创建回放擦音任务</text>

      <!-- 9 AMS → 审查服务：擦音完成回调（coral headline，返回） -->
      <path d="M 786,404 H 574" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="596" y="382" width="164" height="14" rx="2" fill="#f5f5f5"/>
      <text x="678" y="393" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑨ 擦音完成回调 · muted_file_url</text>

      <!-- 10 审查服务 → 回放页：拼接·发布状态推送（异步） -->
      <path d="M 574,440 H 1002" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="688" y="418" width="128" height="14" rx="2" fill="#f5f5f5"/>
      <text x="752" y="429" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑩ 拼接·发布状态推送</text>

      <!-- 11 回放页 → 审查服务：审核/拼接/发布操作 -->
      <path d="M 1006,472 H 578" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="692" y="450" width="152" height="14" rx="2" fill="#f5f5f5"/>
      <text x="768" y="461" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑪ 审核 / 拼接 / 发布操作</text>

      <!-- 12 审查服务 → 回放页：操作结果（返回） -->
      <path d="M 574,500 H 1002" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="716" y="478" width="60" height="14" rx="2" fill="#f5f5f5"/>
      <text x="746" y="489" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">⑫ 操作结果</text>

      <!-- ===== 参与者 ===== -->
      <rect x="55" y="64" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="55" y="64" width="150" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="130" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">腾讯云审核</text>
      <text x="130" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">API-AUDIT-001</text>

      <rect x="275" y="64" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="275" y="64" width="150" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">回调网关</text>
      <text x="350" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">GATEWAY</text>

      <rect x="495" y="64" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="495" y="64" width="150" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="570" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">审查服务</text>
      <text x="570" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">PLATFORM · CORE</text>

      <rect x="715" y="64" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="715" y="64" width="150" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="790" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">腾讯云 AMS</text>
      <text x="790" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">API-AUDIT-004/005</text>

      <rect x="935" y="64" width="150" height="44" rx="6" fill="#f5f5f5"/>
      <rect x="935" y="64" width="150" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="1010" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">回放页 · 运营</text>
      <text x="1010" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">TENANT PC</text>

      <!-- ===== 图例 ===== -->
      <line x1="40" y1="596" x2="1060" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NOTES</text>
      <text x="104" y="616" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">回调全量接收（BR-AUDIT-005）：验签失败或重复事件被网关拦截，不进入业务；断流指令仅 L1 引擎自动断流与运营确认断流两个来源。</text>
      <text x="104" y="634" fill="#4f5d75" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">无违规场次跳过 AMS 擦音任务，源码文件即对外发布版；擦音任务失败或超时按 BR-AUDIT-019 降级处理（锁定播放 / 警告标注 / 可重试）。</text>
      <text x="104" y="652" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif">接口编号对应 PRD §16 外部接口标注：① API-AUDIT-001 回调 ⑥ API-AUDIT-007 断流 ⑧⑨ API-AUDIT-004/005 AMS 擦音。</text>
    </svg>
  </div>
</body>
</html>
