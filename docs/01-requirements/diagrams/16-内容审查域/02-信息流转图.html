<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容审查域 · 信息流转图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 内容审查域 PRD v2.0.0 · 图 9-2</p>
    <h1>信息流转架构：外部审核到三端分发</h1>

    <svg viewBox="0 0 1180 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-df-title audit-df-desc">
      <title id="audit-df-title">信息流转架构：外部审核到三端分发</title>
      <desc id="audit-df-desc">信息流转图：腾讯云审核引擎与擦音服务经回调网关接入平台审查服务，违规数据落库后通过 WebSocket 与指令通道分发给直播中控、观众端与回放页三端。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 区域边界（先画） ===== -->
      <rect x="40" y="80" width="240" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="84" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="92" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL · 腾讯云</text>

      <rect x="340" y="80" width="280" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="348" y="84" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PLATFORM · SAAS 审查域</text>

      <rect x="680" y="80" width="460" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="688" y="84" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENTS · 三端</text>

      <!-- ===== 箭头（先于节点） ===== -->

      <!-- 1 审核引擎 → 回调网关：审核回调 -->
      <path d="M 250,162 H 386" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="278" y="140" width="84" height="14" rx="2" fill="#f5f5f5"/>
      <text x="320" y="151" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">审核回调 POST</text>

      <!-- 2 回调网关 → 审查服务：分发违规事件（异步） -->
      <path d="M 480,194 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="492" y="228" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="544" y="239" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">分发违规事件 · MQ</text>

      <!-- 3 审查服务 → 数据存储：违规入库·证据 -->
      <path d="M 480,376 V 466" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="408" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="544" y="419" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">违规入库 · 证据存储</text>

      <!-- 4 审查服务 → 直播中控：WebSocket 实时告警 -->

      <rect x="648" y="218" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="704" y="229" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">WebSocket 实时告警</text>

      <!-- 5 审查服务 → 观众端：擦音指令下发 -->
      <path d="M 570,330 H 712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="308" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="632" y="319" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">擦音指令下发</text>

      <!-- 6 审查服务 → 回放页：拼接·发布状态推送 -->
      <path d="M 570,355 H 796 Q 810,355 810,367 V 426" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <text x="668" y="387" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">拼接·发布状态推送</text>

      <!-- 7 审查服务 → 审核引擎：断流指令 -->

      <text x="240" y="305" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">断流指令 DropLiveStream</text>

      <!-- 8 审查服务 → AMS：回放擦音任务 -->
      <path d="M 390,348 H 168 Q 160,348 160,356 V 426" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="196" y="356" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="240" y="367" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">回放擦音任务</text>

      <!-- 9 AMS → 审查服务：擦音完成回调（虚线回传） -->
      <path d="M 190,430 V 390 H 412 Q 420,390 420,382 V 380" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="240" y="396" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="292" y="407" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">擦音完成回调</text>

      <!-- 10 数据存储 → 回放页：回放文件·违规档案读取 -->
      <path d="M 570,490 H 712" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="588" y="468" width="112" height="14" rx="2" fill="#f5f5f5"/>
      <text x="644" y="479" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">回放文件·档案读取</text>

      <!-- 11 直播中控 → 审查服务：处置指令提交 -->
      <path d="M 720,152 H 664 Q 656,152 656,160 V 302 Q 656,310 664,310 H 574" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="664" y="216" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="716" y="227" fill="#7a8399" font-size="10" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">处置指令提交</text>

      <!-- ===== 节点 ===== -->

      <!-- 腾讯云直播审核引擎（外部） -->
      <rect x="70" y="130" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="70" y="130" width="180" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

      <text x="92" y="145" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="160" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">直播审核引擎</text>

      <text x="480" y="184" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">验签 · 幂等去重 · 分发</text>

      <rect x="390" y="300" width="180" height="76" rx="6" fill="#f5f5f5"/>

      <text x="480" y="358" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">级别判定 · 处置 · 推送</text>

      <rect x="398" y="476" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="412" y="485" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="480" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">数据存储</text>
      <text x="480" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">DB 违规/处置 + COS 证据/回放</text>

      <!-- 直播中控 PC -->
      <rect x="720" y="112" width="180" height="64" rx="6" fill="#f5f5f5"/>
